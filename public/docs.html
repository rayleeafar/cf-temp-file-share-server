<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Docs — Temp File Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface-hover: #1a1a26;
      --border: rgba(255, 255, 255, 0.06);
      --accent: #00f0ff;
      --text: #e0e0e0;
      --text-dim: #8888aa;
      --text-muted: #666688;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 50% 0, rgba(0, 240, 255, 0.03) 0%, transparent 60%),
        radial-gradient(circle at 80% 100%, rgba(0, 255, 136, 0.02) 0%, transparent 50%);
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .navbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .navbar-brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .navbar-links {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .navbar-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .navbar-links a:hover {
      color: var(--accent);
    }

    .swagger-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* ---- Override Swagger UI theme for dark mode ---- */
    .swagger-ui {
      color: var(--text);
    }

    .swagger-ui .topbar { display: none; }

    .swagger-ui .info {
      margin: 20px 0;
    }

    .swagger-ui .info .title {
      color: var(--text);
      font-family: var(--font);
    }

    .swagger-ui .info .description p {
      color: var(--text-dim);
      font-family: var(--font);
    }

    .swagger-ui .info .title small.version-stamp {
      background: var(--accent);
      color: #000;
    }

    .swagger-ui .info a {
      color: var(--accent);
    }

    .swagger-ui .info a:hover {
      color: #66f5ff;
    }

    .swagger-ui .opblock-tag {
      color: var(--text);
      font-family: var(--font);
      border-bottom: 1px solid var(--border);
    }

    .swagger-ui .opblock-tag:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .swagger-ui .opblock {
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: none;
      margin: 0 0 15px;
    }

    .swagger-ui .opblock .opblock-summary {
      border-bottom: 1px solid var(--border);
    }

    .swagger-ui .opblock .opblock-summary-description {
      color: var(--text-dim);
      font-family: var(--font);
    }

    .swagger-ui .opblock.opblock-get {
      border-color: rgba(97, 175, 254, 0.3);
      background: rgba(97, 175, 254, 0.03);
    }

    .swagger-ui .opblock.opblock-get .opblock-summary {
      border-color: rgba(97, 175, 254, 0.2);
    }

    .swagger-ui .opblock.opblock-get .opblock-summary-method {
      background: #61affe;
    }

    .swagger-ui .opblock.opblock-post {
      border-color: rgba(73, 204, 144, 0.3);
      background: rgba(73, 204, 144, 0.03);
    }

    .swagger-ui .opblock.opblock-post .opblock-summary {
      border-color: rgba(73, 204, 144, 0.2);
    }

    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: #49cc90;
    }

    .swagger-ui .opblock.opblock-put {
      border-color: rgba(252, 161, 48, 0.3);
      background: rgba(252, 161, 48, 0.03);
    }

    .swagger-ui .opblock.opblock-put .opblock-summary {
      border-color: rgba(252, 161, 48, 0.2);
    }

    .swagger-ui .opblock.opblock-put .opblock-summary-method {
      background: #fca130;
    }

    .swagger-ui .opblock .opblock-section-header {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .swagger-ui .opblock .opblock-section-header h4 {
      color: var(--text);
      font-family: var(--font);
    }

    .swagger-ui .opblock .opblock-section-header label {
      color: var(--text-dim);
      font-family: var(--font);
    }

    .swagger-ui .opblock .opblock-external-docs-wrapper {
      color: var(--text-dim);
    }

    .swagger-ui .opblock .opblock-external-docs-wrapper h4 {
      color: var(--text);
    }

    .swagger-ui table thead tr td,
    .swagger-ui table thead tr th {
      color: var(--text);
      font-family: var(--font);
      border-bottom: 1px solid var(--border);
    }

    .swagger-ui .parameter__name {
      color: var(--text);
      font-family: var(--font);
    }

    .swagger-ui .parameter__type {
      color: var(--text-muted);
      font-family: var(--font);
    }

    .swagger-ui .parameters-col_description {
      color: var(--text-dim);
    }

    .swagger-ui .model-box {
      background: rgba(255, 255, 255, 0.02);
      border-radius: var(--radius-sm);
    }

    .swagger-ui .model {
      color: var(--text);
      font-family: var(--font);
    }

    .swagger-ui .model-title {
      color: var(--text);
      font-family: var(--font);
    }

    .swagger-ui .model .property {
      color: var(--text-dim);
      font-family: var(--font);
    }

    .swagger-ui .model .property.primitive {
      color: var(--accent);
    }

    .swagger-ui span.model-toggle {
      color: var(--text-muted);
    }

    .swagger-ui .btn {
      font-family: var(--font);
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .swagger-ui .btn.execute {
      background: linear-gradient(135deg, var(--accent), rgba(0, 200, 255, 0.8));
      color: #000;
      font-weight: 700;
      border: none;
    }

    .swagger-ui .btn.execute:hover {
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .swagger-ui .btn.clear {
      color: var(--text-dim);
      border-color: var(--border);
    }

    .swagger-ui .btn.clear:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .swagger-ui .btn.cancel {
      color: var(--error, #ff3355);
      border-color: var(--border);
    }

    .swagger-ui .response-col_status {
      color: var(--text);
      font-family: var(--font);
    }

    .swagger-ui .response-col_links {
      color: var(--text-dim);
    }

    .swagger-ui .response-col_description {
      color: var(--text-dim);
    }

    .swagger-ui .responses-inner h4,
    .swagger-ui .responses-inner h5 {
      color: var(--text);
      font-family: var(--font);
    }

    .swagger-ui .markdown p,
    .swagger-ui .markdown li {
      color: var(--text-dim);
      font-family: var(--font);
    }

    .swagger-ui .markdown code {
      color: var(--accent);
      background: rgba(0, 240, 255, 0.1);
      border-radius: 3px;
      padding: 2px 6px;
      font-family: 'Fira Code', 'Consolas', monospace;
    }

    .swagger-ui section.models {
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .swagger-ui section.models.is-open h4 {
      border-bottom: 1px solid var(--border);
    }

    .swagger-ui section.models h4 {
      color: var(--text);
      font-family: var(--font);
    }

    .swagger-ui section.models .model-container {
      background: rgba(255, 255, 255, 0.02);
      border-radius: var(--radius-sm);
      margin: 0;
    }

    .swagger-ui .model-box .model .inner-object {
      background: rgba(255, 255, 255, 0.02);
    }

    .swagger-ui .servers {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
    }

    .swagger-ui .servers label {
      color: var(--text-dim);
      font-family: var(--font);
    }

    .swagger-ui .servers select {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
    }

    .swagger-ui select {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      font-family: var(--font);
    }

    .swagger-ui input[type=text] {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
    }

    .swagger-ui input[type=text]:focus {
      border-color: var(--accent);
    }

    .swagger-ui textarea {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Fira Code', 'Consolas', monospace;
    }

    .swagger-ui textarea:focus {
      border-color: var(--accent);
    }

    .swagger-ui .loading-container {
      padding: 40px 0;
    }

    .swagger-ui .loading-container .loading {
      color: var(--text-dim);
    }

    .swagger-ui .errors-wrapper {
      background: rgba(255, 51, 85, 0.1);
      border: 1px solid rgba(255, 51, 85, 0.2);
    }

    .swagger-ui .errors-wrapper hgroup {
      background: rgba(255, 51, 85, 0.15);
    }

    .swagger-ui .errors-wrapper hgroup h4 {
      color: #ff3355;
      font-family: var(--font);
    }

    .swagger-ui .errors-wrapper hgroup small {
      color: var(--text-dim);
    }

    .swagger-ui .prop-type {
      color: var(--accent);
    }

    .swagger-ui .parameter__name.required:after {
      color: #ff3355;
    }

    .swagger-ui .parameter__in {
      color: var(--text-muted);
      font-family: var(--font);
    }

    .swagger-ui .response-control-media-type__accept-message {
      color: var(--text-muted);
      font-family: var(--font);
    }

    .swagger-ui .response-control-media-type__accept-label {
      color: var(--text-dim);
    }

    .swagger-ui table tbody tr td {
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .swagger-ui .scheme-container {
      background: transparent;
      box-shadow: none;
      padding: 0;
    }

    .swagger-ui .opblock-body select {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .swagger-ui .download-url-input-wrapper {
      display: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.12); }

    /* Selection */
    ::selection { background: rgba(0, 240, 255, 0.25); color: #fff; }

    @media (max-width: 600px) {
      .navbar { padding: 0.75rem 1rem; }
      .navbar-brand { font-size: 0.95rem; }
      .swagger-wrapper { padding: 0.75rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Temp File Server</a>
    <div class="navbar-links">
      <a href="/">App</a>
      <a href="/docs.html">API Docs</a>
    </div>
  </nav>

  <div class="swagger-wrapper">
    <div id="swagger-ui"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: "/spec/openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis
      ],
      defaultModelsExpandDepth: 1,
      defaultModelExpandDepth: 1,
      docExpansion: "list",
      filter: true,
      tryItOutEnabled: false,
      syntaxHighlight: {
        theme: "monokai"
      }
    });
  </script>
</body>
</html>
